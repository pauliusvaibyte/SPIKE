# ── Round 13 declaration — walk-forward selection replay (2026-09-24) ──
# Declared BEFORE execution. Motivation: forward accrual is slow; this is
# the strongest pseudo-OOS test available on existing data.
round13_walkforward:
  question: "would the flagship rule family have been DISCOVERABLE and
    profitable if the clock stopped at C in {2017,2019,2021,2023}?"
  design:
    selection: "grid screen on data <= C only: trend rule a*(px>SMA_f) +
      b*((px>SMA_s)&SMA_s rising k) with f in {20,30,45,60}, s in
      {90,125,200}, k in {5,10}, a in {0.4,0.5,0.6} (b=1-a); dampers in
      {none, N-leg, V-leg, N+V}. Score = strategy_stats Sharpe @10bp.
      N-leg unavailable pre-C where CM flow coverage absent — honest:
      a 2017 researcher had no CM data."
    oos: "selected config applied to data > C -> end; report OOS Sharpe,
      hit, net bp, MaxDD, and cost stress at 10/20/30bp RT"
    clock: "harmony_extended px_bitstamp (2011->2026 full span); stress
      via run_round10._stress (refreshed CM); mvrv via harmony_daily"
  falsifies: "if selected configs do not transfer OOS across truncations,
    the flagship's RESEARCH_SUPPORTED is selection luck, not mechanism.
    If they transfer, forward accrual risk is materially reduced."
  n_trials: "~288 configs x 4 cutoffs; DSR on OOS legs accounts for the
    screen multiplicity"

