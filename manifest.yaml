# ── Execution plan (order fixed) ──────────────────────────────────────────
execution:
  step1_power_gate: "MinTRL/effective-n per candidate; UNDERPOWERED recorded without compute"
  step2_validator_calibration: "run fixtures only; harness must kill nulls, catch leak, retain planted edge"
  step3_evaluation: "walk-forward + purged K-fold + CPCV -> PBO/PSR/DSR -> placebos -> prefix-invariance -> verdict"
  verdicts: [RESEARCH_SUPPORTED, WATCH, UNDERPOWERED, KILL, MODEL_RISK, BLOCKED]
  decision_tree: |
    survivor -> Phase 0 justified
    all UNDERPOWERED -> invest in data, not architecture
    all well-powered KILL -> invest in hypotheses, not architecture

# ── Errata (recorded post-run, 2026-09-23; declared spec left unchanged) ─
errata:
  - id: E1
    item: "fra_* spec text said 'evaluated on 1h candle closes'; implementation
           evaluates on 15m bars (horizon_bars=96 = 24h). Reason: 1h cache ends
           2026-05-21 and has zero overlap with the funding window (Jun 14-Sep 12).
           15m is finer and closer to the live 5-min mid evaluation — deviation
           improves fidelity, recorded here for honesty."
  - id: E2
    item: "power_gate gained a temporal-span criterion (>=30d) post-implementation:
           event count alone overstates effective n for clustered/autocorrelated
           signals. This implements the manifest's own declared expectation that
           ofi_imbalance_l2 emits UNDERPOWERED (its journal spans ~19d)."
  - id: E3
    item: "data eras are disjoint: 1d/1h/4h caches span ~Jun2025-May2026 while
           15m/funding/L2 cover Mar-Sep2026. Powered KILL verdicts on the old-era
           candidates therefore bound a different regime set than the recent
           Aug-Sep rally. Neither era validates the other."
  - id: E4
    item: "planted_weak_edge (p=0.58) produces Sharpe ~5 which trips the
           implausibility flag — cosmetic; the fixture still passes survival
           criteria. A deliberately strong edge was chosen to prove the harness
           retains real signal; the flag confirms that gate also works."
  - id: E5
    item: "Round-2 (extended-data) evaluation uses 4h bars for exit paths
           (horizon_bars=6 covers 24h): the 5000-bar API lookback cap makes
           4h the deepest evaluable granularity (833d). Intrabar SL/TP
           resolution is coarser than live 5-min mids — conservative bias."
  - id: E6
    item: "xvenue_funding_disloc: HL funding stamps carry ~50-140ms write
           latency, so the declared (T-8h,T] window excludes the HL settle
           stamped T+eps — the HL 8h sum misses the final hour of the
           Binance epoch period. ~1h phase asymmetry; direction/threshold
           unchanged. Also: HL funding cadence was 8h for launch week only
           (25 rows); hourly since 2023-06-08."

  - id: E7
    date: 2026-09-23
    severity: informational
    scope: harmony_macro_daily / round4 candidates
    issue: >
      harmony btc_price uses a DAY-OPEN convention (blockchain.info
      market-price is stamped at 00:00 UTC = open of day D = close of D-1;
      verified vs HL candles at 12bp residual vs 240bp vs same-day close).
      Round-4 returns are therefore open-to-open, not close-to-close.
      No causality break: all predictors shifted >=1d so signals are known
      before entry open[t]; convention dampens variance slightly vs
      close-to-close. cal_weekend_drift independently cross-validated on
      HL close data (hit 0.595) before this was characterized.
    status: documented; no verdict impact
# ── Post-run state (recorded 2026-09-23 after Phase -1 execution) ────────
