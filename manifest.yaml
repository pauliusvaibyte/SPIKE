  total_signal_evaluations: 85   # distinct candidate ids in reports
                                 # (81 table rows incl. 3 extended retests;
                                 # R14 +4 declared autopsy derivatives;
                                 # R15 +5 live-unused-columns batch)
  effective_families: 53         # ...->+4R12->+1R14 (RISK-OFF composite)
                                 # ->+2R15 (MINING-ECON hashrate,
                                 # RATES-SHOCK us10y; dormancy/pl_ratio/
                                 # sth_mvrv billed to sibling families)
  retests_billed_to_family: ["R1", "R2", "R3", "R4", "OFI-1h", "OFI-8h"]

