# ── Round 3: new-mechanism families (declared 2026-09-23 BEFORE execution) ──
# These are genuinely different economic mechanisms, not mutations of killed
# families. Each spec is frozen here before the runner executes.
round3_candidates:
  data: "data_extended/ (HL funding to launch; HL 1h/4h bars; Binance
         funding+1h klines since 2019/2y)"
  trial_accounting: "n_families effective 9 -> 13 (4 new families added)"
  candidates:
    - id: settle1_funding_drift
      mechanism: "funding-settlement cash flow: when payment magnitude is
                  large, payers' reduction flow pressures price opposite to
                  the funding sign during the settlement hour"
      spec: "fire when |rate| >= rolling-median(|rate|, win=2160h);
             dir = -sign(rate); entry = close of bar ending at settle ts;
             eval = next 1h close-to-close on HL 1h bars"
      falsification: "pooled directional hit ~0.50 or net <= 0 after 10bp"
    - id: xvenue_funding_disloc
      mechanism: "HL vs Binance funding spread convergence: when HL 8h-
                  equivalent funding deviates from Binance's 8h rate, HL's
                  crowded positioning converges -> HL underperforms when
                  spread > 0"
      spec: "per Binance epoch T: hl8h = sum HL hourly rates in (T-8h,T];
             spread = hl8h - bn_rate; fire |spread| >= rolling p90 of
             |spread| (win=540 epochs ~180d); dir = -sign(spread);
             eval +8h (2 bars) on HL 4h bars"
      falsification: "same gates; hit ~0.50 or net <= 0"
    - id: xvenue_leadlag_1h
      mechanism: "price discovery originates on the deeper venue: a large
                  Binance 1h move leads HL's next 1h return"
      spec: "aligned 1h grid (inner join on t); bn_ret = c[i]/c[i-1]-1;
             fire |bn_ret| >= rolling p90 (win=2160); dir = sign(bn_ret);
             eval HL close[i] -> close[i+1]"
      falsification: "same gates; hit ~0.50 or net <= 0"
    - id: xvenue_basis_converge
      mechanism: "HL-Binance price basis dislocations mean-revert: flow
                  dislocation on the smaller venue is transient"
      spec: "aligned 1h grid; basis_bp = (hl_c/bn_c - 1)*1e4; fire
             |basis| >= rolling p99 of |basis| (win=2160);
             dir = -sign(basis); eval +4h (4 bars)"
      falsification: "same gates; expected thin margin vs 10bp RT cost"
  results:
    settle1_funding_drift: "KILL — n=5311, hit .488, net -54789bp, placebo
      p=.997 (worse than random). Settlement-hour drift goes WITH funding
      sign, not against — but inversion is weak (inv hit .512, lo ~.498)."
    xvenue_funding_disloc: "WATCH — n=363 evaluable (202 uncovered, correctly
      NaN'd after coverage fix), hit .540, Wilson lo .489 (gate FAIL by
      .011), net +1810bp, placebo p=.389 — positive net indistinguishable
      from market drift; weakest of the two WATCHes. First-pass run had a
      coverage bug (pre-4h-coverage epochs silently evaluated on the first
      bars of the series, hit .377 KILL) — corrected before this record."
    xvenue_leadlag_1h: "KILL — n=739, hit .448, net -8609bp. Binance moves
      do not lead HL same-direction at 1h."
    xvenue_basis_converge: "KILL — n=198, hit .394, net -4517bp. Dislocations
      continue rather than revert at this threshold/horizon."
  report: reports/report_round3.md

