# ── Forward promotion gate — pre-declared 2026-09-24, BEFORE accrual ──
# Frozen criteria so maturing leads get graded mechanically, not by vibes.
forward_promotion_gate:
  declared: 2026-09-24
  amended: "2026-09-25 — gate semantics hardened in code (deep audit
    A24-C1/C2); text below is the operative criteria, original frozen
    text preserved in git-less ledger history below this block"
  applies_to: "all fwd_* leads + any diagnostic-battery revival that earns
    a fresh declaration"
  PROMOTED: "post-cutoff n_eff >= 30 INDEPENDENT episodes (union-merged
    holding windows; same-shock multi-asset events cluster to one
    episode; uncovered rows excluded) AND wilson_lo >= 0.50 AND net
    ret_bp > 0 @10bp AND drift_skill resolved (>=30 resolved events)
    with mean_skill_bp > 0 AND t_skill > 1.645 AND zero contract
    violations"
  DEAD: "powered n with wilson_lo < 0.50 OR net <= 0"
  ACCRUING: "anything else — no limbo promotions, no partial credit;
    unresolved drift skill can never promote"
  hardened_2026_09_25:
    - "C1: per-asset episode counting switched pairwise->union merge;
      a 40d window + 39 nested 0.5d events now counts 1 episode
      (previously 39 -> false PROMOTED)"
    - "C2: cross-asset dedupe by interval overlap + 60s jitter
      tolerance; same-shock BTC/ETH events count once (previously 2x)"
    - "uncovered rows (NaN ret_bp) excluded from power/wilson/net —
      40 uncovered rows can no longer print DEAD on zero covered obs"
    - "drift gate requires RESOLVED skill (n>=30, t>1.645, mean>0);
      NaN skill = unresolved = cannot promote (was a coin-flip clause)"
    - "mixed datetime units (us vs ns) normalized via _to_ns; all-NaT /
      empty frames BLOCKED not crashed"
  battery_revival_rule: "a dead candidate reviving post-2026-09-24 is a
    NEW hypothesis: fresh declaration + fresh cutoff required; its
    battery stats never count toward promotion"
  promotion_unlocks: "QuantLab stays LOCKED until at least one lead
    PROMOTED at adequate power — even then, promotion means 'fund the
    Sentinely-style frozen spec + shadow', not platform build."

