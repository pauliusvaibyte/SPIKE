  # Powered failures are permanently invalidated. Mutating parameters of a
  # dead family (0.90->0.87, lookback 20->23, SMA 45->48) is the exact
  # overfitting behavior this framework exists to prevent. A new entry in
  # the same economic family requires a genuinely different mechanism,
  # declared as a NEW family in trial_accounting.
  invalidation_corpus:
    - tsmom_daily_14d      # TREND-2: n=97, net -4194bp, DSR 0.027, placebo p=0.73
    - trend1_donchian_4h   # TREND-1: n=136, net -4531bp, anti-predictive
    - flush1_reversal_15m  # FLUSH-1: n=572, hit 0.503 coin-flip, net -4681bp
    - basis1_premium_p10   # BASIS-1: n=44, net -1114bp
    - mrv_rsi_reversion_1h # MRV-approx: hit 0.554 real direction, net -6125bp
                           # (statistically alive, economically dead @1h/fee)

  # Underpowered candidates are NOT killed and NOT mutated. Spec frozen.
  # Journals become a prospective experiment: collect until the declared
  # requirement, then re-run the identical spec through the identical harness.
  collect_only:
    - id: fra_momentum_p90_long
      required_evidence: ">=30 independent entries (24h-cooldown separated)"
      observed: "n=3 on 90d funding window; +4 live shadow entries post-cutoff"
      next_eligible_test: "when funding history OR shadow journal reaches n>=30 entries"
      current_action: COLLECT_ONLY
    - id: fra_fade_p90_short
      required_evidence: ">=30 pooled BTC+SOL entries"
      observed: "n=9 on 90d funding window"
      next_eligible_test: "same trigger as fra_momentum"
      current_action: COLLECT_ONLY
    - id: ofi_imbalance_l2
      required_evidence: "l2_journal span >=30d minimum (60-90d preferred)"
      observed: "span=19d, n=84 clustered rows"
      next_eligible_test: "~2026-10-03 (span crosses 30d); re-run on new snapshot"
      current_action: COLLECT_ONLY

