meta:
  frozen_at: "2026-09-23"
  ledger_source: "bias_audit_2026-09-04.md (88 entries, 9 signal families + retests)"
  convention:
    fee_per_side_bp: 5          # registered challenger convention; stress at 10bp
    deadband_miss_bp: 1         # par.61 convention: |fwd| < 1bp counts as miss
    wilson_gate: "pooled N>=30 AND Wilson lower > 0.50"   # C179 descriptive gate
    sharpe_annualization: "sqrt(periods_per_year) on the candidate's native bar freq"

