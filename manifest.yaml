      item: "drift_skill() measured market drift over CALENDAR days for
        intraday events (1h/4h t_eval deltas < 1d produced ~zero drift
        subtraction, and multi-day rounding drifted off-bar). Fixed:
        per-event horizon = (t_eval - t) mapped onto the price frame's
        own bars via searchsorted — bar-native, cadence-agnostic."
    - id: A2
      severity: high
      item: "placebo_time_shift() was broken three ways: (a) astype(int64)
        on string-t CSVs crashed; (b) dirty early prices (229 zero/
        nonpositive rows, 1 NaN in harmony btc_price) made shifted
        division yield NaN -> 'NaN >= real' False -> p=0.000 artifact
        (every dirty-frame placebo was silently inflated toward
        significance); (c) sampling drew from the FULL price history
        including eras the candidate could never cover, and ignored
        position weights w (weighted real vs full-size placebo ~2x
        magnitude mismatch). Fixed: robust timestamp parsing, invalid-
        price filter, sampling restricted to the event-covered window,
        weight-preserving shifted returns. Flagship placebo re-ran on
        legitimate math: base p=.002, composite p=.016-.021."
    - id: A3
      severity: high
      item: "power_gate n_eff = span/median-horizon counted every invested
        day as independent — a continuous-position frame with 3419 daily
        events could contain a handful of position episodes. Fixed:
        same-day/continuous frames count EPISODES (dir-change runs);
        discrete frames keep horizon-based n_eff; raw median inspected
        before clamping. Flagship BTC: n_eff=67 (episodes); hlbtc now
        honestly n_eff=17 -> UNDERPOWERED."
    - id: A4
      severity: medium
      item: "candidates_forward._invert() set hit = ret_bp > 0 (NET
        convention) while the event contract + validate_events require
        hit == gross_bp > DEADBAND_BP. 7 inverse-lead CSVs carried 300+
        contract violations. Fixed to gross convention; all event files
        re-validated clean."
    - id: A5
      severity: medium
      item: "settle1_funding_drift recorded t_eval = eval-bar bucket-START
        while event t = funding-print time (T+~73ms) -> 5250 events with
        t_eval < t. Return was causal but the recorded exit instant was
        wrong by one bucket. Fixed: t_eval = eval-bar CLOSE."
    - id: A6
      severity: medium
      item: "ofi_imbalance_l2 used a fixed 8-ROW offset for the declared
        8h horizon — correct only while journal cadence stays ~1h/row.
